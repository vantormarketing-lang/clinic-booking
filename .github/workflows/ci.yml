name: Clinic Booking API CI

on:
  workflow_dispatch:
  push:
    branches:
      - neon-backend-bootstrap
  pull_request:
    branches:
      - main
      - neon-backend-bootstrap

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript build
        run: npm run build
      - name: Run tests
        run: npm test
