<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حجز موعد عيادة</title><style>
:root{--p:#0e948f;--bg:#f2f7f7;--card:white;--line:#d9e7e7;--mut:#667987}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma;background:var(--bg);color:#152e38}header{background:linear-gradient(125deg,#0a2934,#168681);color:white;text-align:center;padding:30px 14px}h1{margin:0}main{max-width:720px;margin:auto;padding:16px}section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 8px 28px #143b420c}h2{font-size:1.1rem;margin:0 0 12px}.options{display:flex;gap:8px;flex-wrap:wrap}.choice{flex:1 1 140px;padding:13px;border:1px solid var(--line);border-radius:12px;background:white;text-align:right;cursor:pointer;color:inherit}.choice.active{border-color:var(--p);background:#e8f6f5}.choice small{display:block;color:var(--mut);margin-top:4px}input,select{display:block;width:100%;padding:12px;margin:0 0 10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:white}.cta{width:100%;padding:14px;border:0;border-radius:12px;background:var(--p);color:white;font-weight:700;font:inherit;cursor:pointer}.hidden{display:none}.msg{margin-top:10px;padding:12px;border-radius:10px}.err{background:#fff0ed;color:#9d2920}.ok{background:#e8f8ed;color:#17643a}.muted{color:var(--mut);text-align:center;padding:10px}
</style><body><header><h1 id="clinic">حجز موعد</h1><p id="welcome">اختر الدكتور والميعاد المناسب</p></header><main>
<section><h2>١. الدكتور</h2><div id="docs" class="options"></div></section>
<section id="daysSec" class="hidden"><h2>٢. اليوم</h2><div id="days" class="options"></div></section>
<section id="slotsSec" class="hidden"><h2>٣. الميعاد</h2><div id="slots" class="options"></div></section>
<section id="formSec" class="hidden"><h2>٤. بيانات الحجز</h2><input id="name" placeholder="الاسم بالكامل"><input id="phone" inputmode="numeric" placeholder="رقم الموبايل 01xxxxxxxxx"><select id="type"><option value="checkup">كشف</option><option value="consultation">استشارة</option><option value="followup">إعادة</option></select><button class="cta" id="book">تأكيد الحجز</button><div id="msg"></div></section>
<p class="muted">حجز مواعيد إلكتروني</p></main><script>
const slug=new URLSearchParams(location.search).get("c")||"demo-clinic", $=id=>document.getElementById(id);let clinic,doctors=[],sched=[],doc,day,slot;
const daytxt=d=>d.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"}),timtxt=d=>d.toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit"}),dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
async function api(path,opts){let r=await fetch("/api"+path,opts);let j=await r.json();if(!r.ok)throw Object.assign(new Error(j.error||"error"),{status:r.status});return j}
function msg(t,k){$("msg").className="msg "+k;$("msg").textContent=t}
function button(box,label,sub,fn){let b=document.createElement("button");b.className="choice";b.textContent=label;if(sub){let s=document.createElement("small");s.textContent=sub;b.append(s);}b.onclick=()=>{box.querySelectorAll(".active").forEach(x=>x.classList.remove("active"));b.classList.add("active");fn()};box.append(b)}
async function load(){try{clinic=await api("/public/"+encodeURIComponent(slug));$("clinic").textContent=clinic.name;$("welcome").textContent=clinic.welcome_message||"اختار الدكتور والميعاد المناسب";if(clinic.primary_color)document.documentElement.style.setProperty("--p",clinic.primary_color);doctors=await api("/public/"+encodeURIComponent(slug)+"/doctors");sched=await api("/public/"+encodeURIComponent(slug)+"/schedules");doctors.forEach(d=>button($("docs"),d.name,(d.specialty||"")+(d.fee?" · "+d.fee+" ج.م":""),()=>chooseDoc(d)));if(!doctors.length)$("docs").textContent="لا يوجد أطباء متاحون حاليا"}catch{$("clinic").textContent="خدمة الحجز غير متاحة حاليا";$("welcome").textContent="تعذر تحميل بيانات العيادة"}}
function chooseDoc(d){doc=d;day=slot=null;$("slotsSec").classList.add("hidden");$("formSec").classList.add("hidden");const mine=sched.filter(s=>s.doctor_id===d.id),box=$("days");box.textContent="";for(let i=0;i<14;i++){let x=new Date();x.setHours(0,0,0,0);x.setDate(x.getDate()+i);if(mine.some(s=>Number(s.weekday)===x.getDay()))button(box,daytxt(x),"",()=>chooseDay(x,mine))} $("daysSec").classList.remove("hidden")}
async function chooseDay(d,mine){day=d;slot=null;$("formSec").classList.add("hidden");let box=$("slots");box.textContent="جارٍ تحميل المواعيد";$("slotsSec").classList.remove("hidden");try{let busy=await api("/public/"+encodeURIComponent(slug)+"/busy?doctorId="+doc.id+"&date="+d.toISOString().slice(0,10)),taken=busy.map(a=>[new Date(a.starts_at),new Date(a.ends_at)]),step=Number(doc.slot_minutes)*60000,free=[],now=new Date();mine.filter(s=>Number(s.weekday)===d.getDay()).forEach(s=>{let [h,m]=s.start_time.split(":").map(Number),[eh,em]=s.end_time.split(":").map(Number),st=new Date(d),en=new Date(d);st.setHours(h,m,0,0);en.setHours(eh,em,0,0);for(let t=st.getTime();t+step<=en.getTime();t+=step){let a=new Date(t),b=new Date(t+step);if(a>now&&!taken.some(([x,y])=>a<y&&b>x))free.push(a)}});box.textContent="";free.sort((a,b)=>a-b).forEach(a=>button(box,timtxt(a),"",()=>{slot=a;$("formSec").classList.remove("hidden");$("msg").textContent=""}));if(!free.length)box.textContent="لا توجد مواعيد متاحة لهذا اليوم"}catch{box.textContent="تعذر تحميل الأوقات"}}
$("book").onclick=async()=>{let n=$("name").value.trim(),p=$("phone").value.replace(/[\s-]/g,"");if(n.length<2)return msg("اكتب الاسم الكامل","err");if(!/^01\d{9}$/.test(p))return msg("رقم الهاتف يجب أن يكون 11 رقم","err");if(!slot)return msg("اختر ميعادا أولا","err");$("book").disabled=true;try{let b=await api("/public/"+encodeURIComponent(slug)+"/bookings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({clinicId:clinic.id,doctorId:doc.id,fullName:n,phone:p,startsAt:slot.toISOString(),visitType:$("type").value})});msg("تم الحجز! رقم الحجز: "+b.booking.id,"ok");$("book").classList.add("hidden")}catch(e){msg(e.status===409?"الميعاد اتاخد للتو، اختار غيره":"تعذر الحجز، حاول مرة أخرى","err");if(e.status===409)chooseDay(day,sched.filter(s=>s.doctor_id===doc.id))}finally{$("book").disabled=false}};
load();
</script></body></html>
